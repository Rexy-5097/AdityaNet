# SuryaNet V3 Expanded Hyperparameter Search Space
# Includes structural model parameters and optimization spaces for retraining.

hyperparameter_search_space:
  training_parameters:
    learning_rate:
      type: float_range
      bounds: [1e-5, 5e-4]
    dropout:
      type: float_range
      bounds: [0.1, 0.4]
    weight_decay:
      type: float_range
      bounds: [1e-5, 1e-3]
    focal_gamma:
      type: float_range
      bounds: [1.5, 3.0]
    batch_size:
      type: discrete_choices
      choices: [64, 128, 256]
    gradient_clipping:
      type: float_range
      bounds: [0.5, 2.0]
    optimizer:
      type: discrete_choices
      choices: [AdamW]
    scheduler:
      type: discrete_choices
      choices: [CosineAnnealingLR, None]
    warmup_epochs:
      type: integer_range
      bounds: [0, 5]
    class_weighting_strategy:
      type: discrete_choices
      choices: [dynamic_clamped_pos_rate, equal_weighting, focal_only]

  structural_parameters:
    encoder_dimension:
      type: discrete_choices
      choices: [64, 128, 160, 256]
    patch_length:
      type: discrete_choices
      choices: [8, 12, 16, 24]
    transformer_depth:
      type: discrete_choices
      choices: [3, 4, 5, 6]
    attention_heads:
      type: discrete_choices
      choices: [4, 8, 16]
    feedforward_dimension:
      type: discrete_choices
      choices: [256, 512, 640, 1024]
    drop_path:
      type: float_range
      bounds: [0.0, 0.2]
    label_smoothing:
      type: float_range
      bounds: [0.0, 0.1]
    window_length:
      type: discrete_choices
      choices: [180, 360, 720]
