# Generated by web/scripts/postbuild.ts — do not edit by hand.
# Regenerated on every build from the same header set as vercel.json and _headers,
# so the Content-Security-Policy cannot drift between hosts.
services:
  - type: web
    name: adityanet
    runtime: static
    buildCommand: npm i -g pnpm@10.28.2 && pnpm --dir web install --frozen-lockfile && pnpm --dir web run build
    staticPublishPath: ./web/dist
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'sha256-Q2BPg90ZMplYY+FSdApNErhpWafg2hcRRbndmvxuL/Q=' 'sha256-Ya0pUYrC7nM5Cn/056TyVuEiz6dFGrzmkWzgON0pF0U=' 'sha256-oeC+Q/IUKejgfNErlRQh3YPaFZI0jw62NhO8MDkghj4=' 'sha256-eIXWvAmxkr251LJZkjniEK5LcPF3NkapbJepohwYRIc='; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
      - path: /*
        name: X-Content-Type-Options
        value: "nosniff"
      - path: /*
        name: Referrer-Policy
        value: "strict-origin-when-cross-origin"
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: "same-origin"
      - path: /*
        name: Cross-Origin-Resource-Policy
        value: "same-origin"
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=31536000; includeSubDomains"
      - path: /_astro/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
